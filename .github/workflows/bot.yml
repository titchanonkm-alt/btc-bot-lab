name: bot
on:
  schedule:
    # Every 15 minutes, 2 minutes after the quarter so the candle has closed.
    - cron: "2,17,32,47 * * * *"
  workflow_dispatch:
    inputs:
      reset:
        description: "Wipe all books and start a phase (leave empty for a normal run)"
        type: choice
        options: ["", "shakedown", "count"]
        default: ""
concurrency:
  group: bot
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run bot
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          MARKET_DATA_KEY: ${{ secrets.MARKET_DATA_KEY }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          RESET: ${{ inputs.reset }}
